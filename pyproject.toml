[project]
name = "media-watermark-detector"
version = "1.0.1"
description = "Media watermark detection (YOLOv8) — composite scan + move/delete + undo"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "image", "watermark", "yolo", "detection", "dataset", "ai"]
dependencies = [
    "ultralytics>=8.0.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
