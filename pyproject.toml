[project]
name = "watermark-detection"
version = "0.1.0"
description = "YOLOv8-based watermark detection and dataset cleaning"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["watermark", "detection", "yolov8", "image", "dataset"]
dependencies = [
    "ultralytics>=8.0.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
